server.port=8001

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/voters}
spring.datasource.username=${DB_USER:voters}
spring.datasource.password=${DB_PASSWORD:voters}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:dev-jwt-secret-change-me-0123456789abcdef}

service.api-key=${SERVICE_API_KEY:dev-service-key}

cors.origins=${CORS_ORIGINS:http://localhost:3000}