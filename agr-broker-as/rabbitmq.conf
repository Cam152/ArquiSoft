# Configuración de agr-broker-as. Se suma a la de la imagen oficial (conf.d/).

# Topología (exchanges, colas, enlaces) y usuario. El archivo lo genera
# entrypoint.sh al arrancar, a partir de definitions.template.json.
load_definitions = /etc/rabbitmq/definitions.json

# Logs a la salida estándar (docker compose logs agr-broker-as).
log.console = true
log.console.level = info
log.file = false

# Consola web.
management.tcp.port = 15672

# Si el disco del equipo se llena, RabbitMQ deja de aceptar mensajes en lugar
# de perder los que ya tiene.
disk_free_limit.absolute = 200MB
