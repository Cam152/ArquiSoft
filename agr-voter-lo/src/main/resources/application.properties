server.port=8001

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/voters}
spring.datasource.username=${DB_USER:voters}
spring.datasource.password=${DB_PASSWORD:voters}

# Crea la tabla ballots_cast al arrancar (schema.sql, idempotente).
spring.sql.init.mode=always

# Llave que solo conoce agr-gateway-or (header X-Service-Key).
service.api-key=${SERVICE_API_KEY:dev-service-key}

# Errores siempre como {"detail": "..."} (ApiExceptionHandler).
server.error.whitelabel.enabled=false
