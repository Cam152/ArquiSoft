server.port=8001

# H2 en memoria con sintaxis de PostgreSQL (soporta ON CONFLICT DO NOTHING).
spring.datasource.url=jdbc:h2:mem:voters;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

service.api-key=test-service-key

server.error.whitelabel.enabled=false
