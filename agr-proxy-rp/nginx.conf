# =============================================================================
# agr-proxy-rp · Reverse Proxy de AGORA (S2 · Reverse Proxy, responsable: Cristian)
#
# Único punto de entrada desde fuera de Docker:
#   /            -> agr-web-fr:3000      (páginas de Next.js)
#   /api/        -> agr-gateway-or:8080  (sin el prefijo: /api/votes llega como /votes)
#   /api/admin/  -> no se expone (la CLI usa la red interna)
#
# Secciones marcadas para otros escenarios:
#   S1 · Secure Channel (Miguel):  TLS 1.2/1.3 en el 443, redirección 80 -> 443 y HSTS.
#   S4 · Fuerza bruta (Esteban):    límite de intentos en /api/auth/login.
#
# Al arrancar, el contenedor pasa este archivo por envsubst y solo reemplaza
# ${LOGIN_RATE} y ${LOGIN_BURST}. Las variables propias de Nginx ($host,
# $remote_addr...) no se tocan.
# =============================================================================

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

# Módulos instalados con apk. headers-more permite quitar el encabezado Server.
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65s;

    # Log de cada petición: IP, método, ruta, código, duración y réplica que
    # respondió. Nunca cuerpos ni encabezados (el JWT viaja en Authorization).
    log_format agora '$remote_addr [$time_local] "$request_method $request_uri" $status '
                     '$body_bytes_sent $request_time up=$upstream_addr';
    access_log /dev/stdout agora;

    # ---- No revelar la tecnología --------------------------------------------
    server_tokens off;                # sin versión de Nginx en ningún lado
    more_clear_headers Server;        # sin encabezado Server
    more_clear_headers X-Powered-By;  # por si algún servicio lo envía
    more_clear_headers X-Nextjs-*;    # encabezados internos de Next.js

    # ---- DNS de Docker -------------------------------------------------------
    # Los destinos se resuelven en cada petición (con caché de 10 s), no solo al
    # arrancar: si la web o el gateway se reinician con otra IP, o si el gateway
    # corre con varias réplicas (R4), el proxy las encuentra y reparte entre ellas.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ---- Destinos con conexiones reutilizables (R1/R4) ------------------------
    # Con "proxy_pass http://$variable" Nginx abría una conexión TCP nueva hacia el
    # gateway en cada petición. Con carga (R1, 500+ usuarios) se agotaban los
    # puertos locales del proxy (connect() failed (99: Address not available)) y
    # respondía 502. Un upstream con "keepalive" reutiliza las conexiones, y
    # "resolve" (Nginx >= 1.27.3) sigue resolviendo el nombre con el DNS de Docker:
    # cada réplica del gateway (R4) es un destino y se reparten en round robin.
    upstream agr_gateway {
        zone agr_gateway 64k;
        server agr-gateway-or:8080 resolve;
        keepalive 64;
    }
    upstream agr_web {
        zone agr_web 64k;
        server agr-web-fr:3000 resolve;
        keepalive 16;
    }

    # ---- Límite de tamaño ----------------------------------------------------
    # Nada de más de 1 MB llega a la web ni al gateway: el proxy responde 413.
    client_max_body_size 1m;

    # ---- S4 · Fuerza bruta (Esteban) -----------------------------------------
    # Intentos de login por IP. La tasa sale de LOGIN_RATE (por defecto 5r/m) y
    # la ráfaga de LOGIN_BURST (por defecto 5); R2 puede subirlas.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=${LOGIN_RATE};
    limit_req_status 429;

    server {
        listen 443 ssl default_server;
        server_name localhost;

        # ---- S1 · Secure Channel (Miguel) ------------------------------------
        # TLS se termina aquí: lo que entra desde fuera de Docker viaja cifrado hasta
        # este proxy. Detrás, en agr-edge-net (internal, S3), el tráfico sigue en HTTP.
        # El certificado y la llave NO están en la imagen ni en el repositorio: los
        # genera p3/s1/gen-certs.sh en p3/s1/certs/ y docker-compose.yml los monta en
        # /etc/nginx/certs como solo lectura. El 80 solo redirige (server de más abajo).
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Solo TLS 1.2 y 1.3 (TLS 1.0 y 1.1 se rechazan). En 1.2 solo suites ECDHE con
        # AEAD (secreto perfecto hacia adelante); las de 1.3 las fija OpenSSL.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # Reanudación de sesiones: el handshake se paga una vez por cliente y no por
        # conexión (importa para R3). Sin tickets, para conservar el secreto perfecto.
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS: el navegador solo volverá a este host por HTTPS durante un año. Va en
        # todas las respuestas HTTPS (también en errores, por el "always").
        add_header Strict-Transport-Security "max-age=31536000" always;
        # ----------------------------------------------------------------------

        # ---- Encabezados de seguridad (todas las respuestas, también errores) --
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # Next.js ya envía algunos: se quitan los de origen para no duplicarlos.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Content-Security-Policy;

        # ---- Encabezados hacia la web y el gateway ---------------------------
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;

        # Destinos: los upstream agr_web y agr_gateway (arriba), con keepalive.

        # ---- Web -------------------------------------------------------------
        location / {
            proxy_pass http://agr_web;
            error_page 413 = @too_large;
            error_page 502 503 504 = @web_down;
        }

        # ---- API: todo lo que va al gateway, sin el prefijo /api -------------
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://agr_gateway;
            error_page 413 = @too_large;
            error_page 502 503 504 = @api_down;
        }

        # ---- Administración: solo por la red interna ------------------------
        # La CLI (agr-admin-fr) llama a /admin/... directo al gateway por
        # agr-edge-net. Desde fuera no hace falta, así que el proxy no la expone.
        location ~ ^/api/admin(/|$) {
            default_type application/json;
            charset utf-8;
            charset_types application/json;
            return 404 '{"detail":"Recurso no encontrado."}';
        }

        # ---- Resultados en vivo (SSE): sin buffer y con conexión larga -------
        location ~ ^/api/results/[0-9]+/stream$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://agr_gateway;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            error_page 502 503 504 = @api_down;
        }

        # ---- S4 · Fuerza bruta (Esteban): login con límite por IP ------------
        location = /api/auth/login {
            limit_req zone=login_limit burst=${LOGIN_BURST} nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://agr_gateway;
            error_page 413 = @too_large;
            error_page 429 = @too_many;
            error_page 502 503 504 = @api_down;
        }

        # ---- Errores propios, con la forma {"detail": ...} de AGORA ----------
        # Reemplazan las páginas de error de Nginx, que mencionan "nginx".
        location @too_large {
            default_type application/json;
            charset utf-8;
            charset_types application/json;
            return 413 '{"detail":"La petición supera el tamaño máximo permitido (1 MB)."}';
        }
        location @too_many {
            default_type application/json;
            charset utf-8;
            charset_types application/json;
            return 429 '{"detail":"Demasiados intentos de ingreso. Espera un minuto e intenta de nuevo."}';
        }
        location @api_down {
            default_type application/json;
            charset utf-8;
            charset_types application/json;
            return 502 '{"detail":"Un servicio de AGORA no responde. Intenta de nuevo en unos minutos."}';
        }
        location @web_down {
            default_type text/html;
            charset utf-8;
            return 502 '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>AGORA</title></head><body><h1>AGORA no está disponible</h1><p>Intenta de nuevo en unos minutos.</p></body></html>';
        }
    }

    # ---- S1 · Secure Channel (Miguel): redirección 80 -> 443 -----------------
    # El 80 ya no sirve la aplicación: solo redirige al mismo recurso por HTTPS. No lleva
    # HSTS (no tiene sentido por HTTP) ni proxy_pass: nada llega a la web ni al gateway.
    server {
        listen 80 default_server;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ---- Salud del proxy (solo dentro del contenedor) ------------------------
    # Escucha en 127.0.0.1: no se alcanza desde fuera ni cambia cuando entre TLS.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
