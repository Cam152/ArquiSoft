spring.application.name=agr-auth-lo
server.port=8081

# Conexión a la BD privada de autenticación (agr-auth-db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://agr-auth-db:5432/agr_auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT (1 hora de expiración según la especificación del P2)
jwt.secret=${JWT_SECRET:super-secret-key-agora-proto-2-change-this-in-production-32bytes}
jwt.expiration=3600000