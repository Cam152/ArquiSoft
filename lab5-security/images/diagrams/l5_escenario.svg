<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Escenario de calidad · Seguridad (confidencialidad del voto)</text>

  <!-- Fuente -->
  <g>
    <text x="130" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#b03a2e">Fuente</text>
    <circle cx="130" cy="170" r="22" fill="none" stroke="#b03a2e" stroke-width="3"/>
    <line x1="130" y1="192" x2="130" y2="250" stroke="#b03a2e" stroke-width="3"/>
    <line x1="95" y1="215" x2="165" y2="215" stroke="#b03a2e" stroke-width="3"/>
    <line x1="130" y1="250" x2="100" y2="290" stroke="#b03a2e" stroke-width="3"/>
    <line x1="130" y1="250" x2="160" y2="290" stroke="#b03a2e" stroke-width="3"/>
    <text x="130" y="325" text-anchor="middle" font-size="15" fill="#222">Atacante que</text>
    <text x="130" y="345" text-anchor="middle" font-size="15" fill="#222">compromete un</text>
    <text x="130" y="365" text-anchor="middle" font-size="15" fill="#222">servicio interno</text>
    <text x="130" y="385" text-anchor="middle" font-size="15" fill="#222">(p. ej. agr-vote-lo)</text>
  </g>

  <!-- Estimulo -->
  <line x1="200" y1="215" x2="430" y2="215" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>
  <text x="315" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f618d">Estímulo</text>
  <text x="315" y="140" text-anchor="middle" font-size="15" fill="#222">Intenta resolver y</text>
  <text x="315" y="160" text-anchor="middle" font-size="15" fill="#222">conectarse a bases,</text>
  <text x="315" y="180" text-anchor="middle" font-size="15" fill="#222">broker o servicios que</text>
  <text x="315" y="200" text-anchor="middle" font-size="15" fill="#222">no le corresponden</text>
  <text x="315" y="250" text-anchor="middle" font-size="15" fill="#222">o salir a internet</text>

  <!-- Ambiente -->
  <rect x="440" y="80" width="420" height="380" rx="14" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="650" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#566573">Ambiente</text>
  <text x="650" y="132" text-anchor="middle" font-size="15" fill="#222">Operación normal, elección abierta</text>

  <!-- Artefacto -->
  <rect x="480" y="155" width="340" height="270" rx="10" fill="#eaf2f8" stroke="#1f618d" stroke-width="2.5"/>
  <text x="650" y="182" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f618d">Artefacto</text>
  <text x="650" y="205" text-anchor="middle" font-size="15" fill="#222">Red de despliegue de AGORA</text>
  <text x="650" y="225" text-anchor="middle" font-size="15" fill="#222">(redes de Docker Compose)</text>
  <rect x="505" y="245" width="140" height="70" rx="6" fill="#ffffff" stroke="#6c3483" stroke-width="2"/>
  <text x="575" y="272" text-anchor="middle" font-size="13" fill="#6c3483">agr-votes-data-net</text>
  <text x="575" y="295" text-anchor="middle" font-size="13" fill="#222">vote-lo · votes-db</text>
  <rect x="655" y="245" width="140" height="70" rx="6" fill="#ffffff" stroke="#117a65" stroke-width="2"/>
  <text x="725" y="272" text-anchor="middle" font-size="13" fill="#117a65">agr-voters-data-net</text>
  <text x="725" y="295" text-anchor="middle" font-size="13" fill="#222">voter-lo · voters-db</text>
  <text x="650" y="287" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">✕</text>
  <text x="650" y="345" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">10 redes · 8 con internal: true</text>
  <text x="650" y="368" text-anchor="middle" font-size="14" fill="#222">un contenedor solo ve a quienes</text>
  <text x="650" y="388" text-anchor="middle" font-size="14" fill="#222">comparten red con él</text>

  <!-- Respuesta -->
  <line x1="860" y1="215" x2="1050" y2="215" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>
  <text x="955" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e8449">Respuesta</text>
  <text x="955" y="140" text-anchor="middle" font-size="15" fill="#222">El nombre no resuelve</text>
  <text x="955" y="160" text-anchor="middle" font-size="15" fill="#222">y la conexión por IP</text>
  <text x="955" y="180" text-anchor="middle" font-size="15" fill="#222">no se establece</text>
  <text x="955" y="250" text-anchor="middle" font-size="15" fill="#222">El compromiso queda</text>
  <text x="955" y="270" text-anchor="middle" font-size="15" fill="#222">contenido en su segmento</text>

  <!-- Medida -->
  <rect x="1060" y="150" width="310" height="230" rx="10" fill="#e9f7ef" stroke="#1e8449" stroke-width="2.5"/>
  <text x="1215" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e8449">Medida</text>
  <text x="1215" y="220" text-anchor="middle" font-size="15" fill="#222">0 caminos no autorizados</text>
  <text x="1215" y="240" text-anchor="middle" font-size="15" fill="#222">en la matriz de alcanzabilidad</text>
  <text x="1215" y="260" text-anchor="middle" font-size="15" fill="#222">(frente a N de la línea base)</text>
  <text x="1215" y="300" text-anchor="middle" font-size="15" fill="#222">100 % de los flujos de negocio</text>
  <text x="1215" y="320" text-anchor="middle" font-size="15" fill="#222">siguen funcionando: login, votar,</text>
  <text x="1215" y="340" text-anchor="middle" font-size="15" fill="#222">resultados, auditoría y CLI</text>

  <text x="700" y="500" text-anchor="middle" font-size="14" fill="#566573">Táctica de Bass et al.: Resistir ataques → separar entidades, limitar el acceso y limitar la exposición.</text>
</svg>
