# CI/CD del sistema de votación.
#   CI: pruebas unitarias de cada servicio, pruebas de punta a punta del Vote Service
#       y arranque del sistema completo con Docker Compose.
#   CD: al llegar a main con todo en verde, publica la imagen del Vote Service en GHCR.
name: CI/CD

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vote-service-unit:
    name: Vote Service - pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-vote-lo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agr-vote-lo/go.mod
          cache-dependency-path: agr-vote-lo/go.sum
      - name: Formato (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear (corran gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet -tags=e2e ./...
      - name: go.mod y go.sum al día
        run: go mod tidy -diff
      - name: Pruebas unitarias
        run: go test -race -cover ./...

  election-service-unit:
    name: Election Service - pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-election-lo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agr-election-lo/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  results-service:
    name: Results Service - formato, lint y pruebas (Redis y RabbitMQ reales)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-results-lo
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: agora
          RABBITMQ_DEFAULT_PASS: agora
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Formato (cargo fmt)
        run: cargo fmt --check
      - name: Lint (clippy)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Pruebas unitarias
        run: cargo test --locked
      - name: Pruebas de integración (Redis y RabbitMQ)
        env:
          TEST_REDIS_URL: redis://localhost:6379
          TEST_AMQP_URL: amqp://agora:agora@localhost:5672/%2f
        run: cargo test --locked --test integration -- --ignored --test-threads=1

  e2e:
    name: Vote Service - pruebas de punta a punta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de punta a punta (Docker Compose)
        run: |
          chmod +x ./agr-vote-lo/e2e/run.sh
          ./agr-vote-lo/e2e/run.sh

  system:
    name: Sistema completo - arranque con Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar todos los contenedores y esperar a que estén sanos
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Comprobar cada componente
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8002/health
          curl --fail --silent --show-error http://localhost:8002/results/1
          curl --fail --silent --show-error --output /dev/null http://localhost:3000
      - name: Logs (si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Apagar
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publicar imagen del Vote Service (GHCR)
    needs: [vote-service-unit, election-service-unit, e2e, system]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Construir y publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/agr-vote-lo"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$image:$GITHUB_SHA" --tag "$image:latest" agr-vote-lo
          docker push --all-tags "$image"