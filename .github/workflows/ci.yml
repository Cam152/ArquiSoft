# CI/CD del sistema de votación.
#   CI: pruebas unitarias de cada servicio, pruebas de punta a punta del Vote Service
#       y arranque del sistema completo con Docker Compose.
#   CD: al llegar a main con todo en verde, publica la imagen del Vote Service en GHCR.
name: CI/CD

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vote-service-unit:
    name: Vote Service - pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-vote-lo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agr-vote-lo/go.mod
          cache-dependency-path: agr-vote-lo/go.sum
      - name: Formato (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear (corran gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet -tags=e2e ./...
      - name: go.mod y go.sum al día
        run: go mod tidy -diff
      - name: Pruebas unitarias
        run: go test -race -cover ./...

  admin-cli-unit:
    name: CLI de administración - pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-admin-fr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agr-admin-fr/go.mod
          cache-dependency-path: agr-admin-fr/go.sum
      - name: Formato (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear (corran gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go.mod y go.sum al día
        run: go mod tidy -diff
      - name: Pruebas unitarias
        run: go test -race -cover -coverpkg=./internal/... ./...

  election-service-unit:
    name: Election Service - pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-election-lo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agr-election-lo/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  voter-service-unit:
    name: Voter Service - pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-voter-lo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas (H2 en modo PostgreSQL)
        run: mvn -B test

  audit-service-unit:
    name: Audit Service - pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-audit-lo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Pruebas unitarias
        run: dotnet test tests/AgrAuditLo.Tests

  gateway-unit:
    name: API Gateway - pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-gateway-or
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pruebas contra servicios simulados
        run: npm test

  web:
    name: Web (Next.js) - pruebas y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-web-fr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agr-web-fr/package-lock.json
      - run: npm ci
      - name: Pruebas de lib/
        run: npm test
      - name: Compilación y revisión de tipos
        run: npm run build

  results-service:
    name: Results Service - formato, lint y pruebas (Redis y RabbitMQ reales)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agr-results-lo
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: agora
          RABBITMQ_DEFAULT_PASS: agora
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Formato (cargo fmt)
        run: cargo fmt --check
      - name: Lint (clippy)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Pruebas unitarias
        run: cargo test --locked
      - name: Pruebas de integración (Redis y RabbitMQ)
        env:
          TEST_REDIS_URL: redis://localhost:6379
          TEST_AMQP_URL: amqp://agora:agora@localhost:5672/%2f
        run: cargo test --locked --test integration -- --ignored --test-threads=1

  e2e:
    name: Vote Service y Broker - pruebas de punta a punta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de punta a punta (Docker Compose)
        run: |
          chmod +x ./agr-vote-lo/e2e/run.sh
          ./agr-vote-lo/e2e/run.sh

  system:
    name: Sistema completo - arranque con Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar el certificado de desarrollo (S1)
        run: bash p3/s1/gen-certs.sh
      - name: Levantar todos los contenedores y esperar a que estén sanos
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Comprobar cada componente
        run: |
          # Desde S1 la entrada es https://localhost (certificado autofirmado: --insecure) y el 80 solo redirige
          # Desde S2 solo se publican 443 y 80 (agr-proxy-rp) y 127.0.0.1:15672: todo se prueba a través del proxy
          # Gateway por /api (el proxy quita el prefijo)
          curl --fail --silent --show-error --insecure https://localhost/api/health
          curl --fail --silent --show-error --insecure --output /dev/null https://localhost/api/elections
          curl --fail --silent --show-error --insecure --output /dev/null https://localhost/api/results/1
          # Web (SSR): página de inicio por el proxy y healthcheck dentro del contenedor
          curl --fail --silent --show-error --insecure --output /dev/null https://localhost/
          docker compose exec -T agr-web-fr wget -qO- http://127.0.0.1:3000/api/health
          # S2: la web y el gateway ya no se alcanzan directo, y /api/admin no se expone
          if curl --silent --output /dev/null --max-time 3 http://localhost:8080/health; then echo "8080 sigue publicado"; exit 1; fi
          if curl --silent --output /dev/null --max-time 3 http://localhost:3000/; then echo "3000 sigue publicado"; exit 1; fi
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' https://localhost/api/admin/elections)" = 404
          # S1: el 80 solo redirige a HTTPS (conserva la ruta y la consulta) y el 443 lleva HSTS
          test "$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' 'http://localhost/api/health?x=1')" = "301 https://localhost/api/health?x=1"
          curl --silent --insecure --dump-header - --output /dev/null https://localhost/ | grep -i '^strict-transport-security: max-age='
          # S1: TLS 1.2 y 1.3 se aceptan; la configuracion solo permite esos dos protocolos
          curl --fail --silent --insecure --tlsv1.2 --tls-max 1.2 --output /dev/null https://localhost/api/health
          curl --fail --silent --insecure --tlsv1.3 --output /dev/null https://localhost/api/health
          docker compose exec -T agr-proxy-rp nginx -T 2>&1 | grep -q 'ssl_protocols       TLSv1.2 TLSv1.3;'
          # S1: la llave privada no esta dentro de la imagen del proxy
          docker run --rm --entrypoint sh "$(docker inspect --format '{{.Image}}' agr-proxy-rp)" -c '! ls /etc/nginx/certs/localhost.key 2>/dev/null'
          # Consola de RabbitMQ y topología cargada desde definitions.json
          curl --fail --silent --show-error --user agora:agora http://localhost:15672/api/exchanges/%2F/agora.votes
          # CLI de administración contra el gateway
          docker compose run --rm agr-admin-fr elections list
      - name: Logs (si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Apagar
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publicar imagen del Vote Service (GHCR)
    needs: [vote-service-unit, admin-cli-unit, election-service-unit, voter-service-unit, audit-service-unit, e2e, system]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Construir y publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/agr-vote-lo"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$image:$GITHUB_SHA" --tag "$image:latest" agr-vote-lo
          docker push --all-tags "$image"