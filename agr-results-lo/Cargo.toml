[package]
name = "results-service"
version = "0.1.0"
edition = "2021"
description = "AGORA: conteo de votos y resultados en vivo (agr-results-lo)"
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
lapin = { version = "2", default-features = false }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-executor-trait = "2"
tokio-reactor-trait = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
