# AGORA - Prototipo 2
# Levantar todo: docker compose up --build -d --wait
#
# Convención: el servicio, el contenedor y la carpeta se llaman igual (agr-<nombre>-<nivel>).
# Redes (vista de despliegue, Lab 5 - Network Segmentation; ver la sección REDES):
#   agr-edge-net         web + CLI + gateway      (la presentación solo alcanza al gateway)
#   agr-back-net         gateway + servicios      (el gateway llega a los servicios)
#   agr-<x>-data-net     un servicio + su base    (ningún servicio ve una base ajena)
#   agr-bus-net          broker + vote/results/audit (solo quien usa mensajería)
#   agr-mgmt-net         consola de RabbitMQ
# Solo se publican 3000 (web), 8080 (gateway) y 127.0.0.1:15672 (consola). Para
# depurar un servicio o una base, usen un docker-compose.override.yml local.

services:

  # ============================================================
  # DATOS - ELECCIONES (responsable: David)
  # ============================================================
  agr-elections-db:
    container_name: agr-elections-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ELECTIONS_DB_USER:-elections}
      POSTGRES_PASSWORD: ${ELECTIONS_DB_PASSWORD:-elections}
      POSTGRES_DB: ${ELECTIONS_DB_NAME:-elections}
    volumes:
      - elections-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [agr-elections-data-net]
    restart: unless-stopped


  # ============================================================
  # LÓGICA - ELECTION SERVICE (responsable: David)
  # ============================================================
  agr-election-lo:
    container_name: agr-election-lo
    build: ./agr-election-lo
    environment:
      DATABASE_URL: postgresql+psycopg2://${ELECTIONS_DB_USER:-elections}:${ELECTIONS_DB_PASSWORD:-elections}@agr-elections-db:5432/${ELECTIONS_DB_NAME:-elections}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_DATA: ${SEED_DATA:-true}
    depends_on:
      agr-elections-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [agr-back-net, agr-elections-data-net]
    restart: unless-stopped


  # ============================================================
  # DATOS - VOTANTES (responsable: Camilo)
  # ============================================================
  # Tabla ballots_cast: en qué elecciones ya votó cada votante.
  agr-voters-db:
    container_name: agr-voters-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${VOTERS_DB_USER:-voters}
      POSTGRES_PASSWORD: ${VOTERS_DB_PASSWORD:-voters}
      POSTGRES_DB: ${VOTERS_DB_NAME:-voters}
    volumes:
      - voters-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [agr-voters-data-net]
    restart: unless-stopped


  # ============================================================
  # LÓGICA - VOTER SERVICE (responsable: Camilo)
  # ============================================================
  # Marca y desmarca la participación (saga del voto). Solo lo llama el gateway.
  agr-voter-lo:
    container_name: agr-voter-lo
    build: ./agr-voter-lo
    environment:
      DB_URL: jdbc:postgresql://agr-voters-db:5432/${VOTERS_DB_NAME:-voters}
      DB_USER: ${VOTERS_DB_USER:-voters}
      DB_PASSWORD: ${VOTERS_DB_PASSWORD:-voters}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key}
    depends_on:
      agr-voters-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [agr-back-net, agr-voters-data-net]
    restart: unless-stopped


  # ============================================================
  # DATOS - VOTOS (responsable: Maicol)
  # ============================================================
  # Votos anónimos. Con usuario y clave propios: solo agr-vote-lo los conoce.
  agr-votes-db:
    container_name: agr-votes-db
    image: mongo:7
    # --quiet evita registrar cada conexión del healthcheck
    command: ["mongod", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${VOTES_DB_USER:-votes}
      MONGO_INITDB_ROOT_PASSWORD: ${VOTES_DB_PASSWORD:-votes}
    volumes:
      - votes-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [agr-votes-data-net]
    restart: unless-stopped


  # ============================================================
  # ASINCRONÍA - BROKER (responsable: Maicol)
  # ============================================================
  # RabbitMQ con la topología de agr-broker-as/definitions.template.json
  # (exchange agora.votes, colas de resultados y auditoría, dead-letter).
  agr-broker-as:
    container_name: agr-broker-as
    # Nombre de host fijo: RabbitMQ guarda sus datos por nombre de nodo, así que
    # si cambia (Docker pone uno al azar) los mensajes del volumen se pierden.
    hostname: agr-broker-as
    build: ./agr-broker-as
    environment:
      BROKER_USER: ${BROKER_USER:-agora}
      BROKER_PASSWORD: ${BROKER_PASSWORD:-agora}
    ports:
      - "127.0.0.1:15672:15672"   # Lab 5: consola solo desde esta máquina; AMQP (5672) solo dentro de Docker
    volumes:
      - broker-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [agr-bus-net, agr-mgmt-net]
    restart: unless-stopped


  # ============================================================
  # LÓGICA - VOTE SERVICE (responsable: Maicol)
  # ============================================================
  # Guarda el voto y publica VoteRegistered (outbox). Solo lo llama el gateway.
  agr-vote-lo:
    container_name: agr-vote-lo
    build: ./agr-vote-lo
    environment:
      MONGO_URI: mongodb://${VOTES_DB_USER:-votes}:${VOTES_DB_PASSWORD:-votes}@agr-votes-db:27017/?authSource=admin
      MONGO_DB: ${VOTES_MONGO_DB:-votes}
      AMQP_URL: amqp://${BROKER_USER:-agora}:${BROKER_PASSWORD:-agora}@agr-broker-as:5672/
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key}
    depends_on:
      agr-votes-db:
        condition: service_healthy
      agr-broker-as:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [agr-back-net, agr-votes-data-net, agr-bus-net]
    restart: unless-stopped


  # ============================================================
  # DATOS - RESULTADOS (responsable: Miguel)
  # ============================================================
  # appendonly yes: los conteos sobreviven a un reinicio del contenedor.
  # La clave es la credencial propia de esta base (ningún otro servicio la conoce).
  agr-results-db:
    container_name: agr-results-db
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${RESULTS_DB_PASSWORD:-results}"]
    environment:
      REDISCLI_AUTH: ${RESULTS_DB_PASSWORD:-results}
    volumes:
      - results-db-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [agr-results-data-net]
    restart: unless-stopped


  # ============================================================
  # LÓGICA - RESULTS SERVICE (responsable: Miguel)
  # ============================================================
  # Consume VoteRegistered, mantiene los conteos en Redis y sirve resultados y SSE.
  agr-results-lo:
    container_name: agr-results-lo
    build: ./agr-results-lo
    environment:
      PORT: "8004"
      REDIS_URL: redis://:${RESULTS_DB_PASSWORD:-results}@agr-results-db:6379
      AMQP_URL: amqp://${BROKER_USER:-agora}:${BROKER_PASSWORD:-agora}@agr-broker-as:5672/%2f
      RESULTS_QUEUE: results.vote-registered
    depends_on:
      agr-results-db:
        condition: service_healthy
      agr-broker-as:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [agr-back-net, agr-results-data-net, agr-bus-net]
    restart: unless-stopped


  # ============================================================
  # DATOS - AUDITORÍA (responsable: Camilo)
  # ============================================================
  # Registro inmutable de eventos. Usuario y clave propios: solo agr-audit-lo los conoce.
  agr-audit-db:
    container_name: agr-audit-db
    image: mongo:7
    command: ["mongod", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${AUDIT_DB_USER:-audit}
      MONGO_INITDB_ROOT_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}
    volumes:
      - audit-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [agr-audit-data-net]
    restart: unless-stopped


  # ============================================================
  # LÓGICA - AUDIT SERVICE (responsable: Camilo)
  # ============================================================
  # Consume audit.vote-registered y guarda cada evento. El gateway lo consulta
  # en GET /admin/audit.
  agr-audit-lo:
    container_name: agr-audit-lo
    build: ./agr-audit-lo
    environment:
      MONGO_URI: mongodb://${AUDIT_DB_USER:-audit}:${AUDIT_DB_PASSWORD:-audit}@agr-audit-db:27017/?authSource=admin
      MONGO_DB: ${AUDIT_MONGO_DB:-audit}
      AMQP_URL: amqp://${BROKER_USER:-agora}:${BROKER_PASSWORD:-agora}@agr-broker-as:5672/
    depends_on:
      agr-audit-db:
        condition: service_healthy
      agr-broker-as:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [agr-back-net, agr-audit-data-net, agr-bus-net]
    restart: unless-stopped


  # ============================================================
  # DATOS - AUTENTICACIÓN (responsable: Esteban)
  # ============================================================
  agr-auth-db:
    image: postgres:16-alpine
    container_name: agr-auth-db
    environment:
      POSTGRES_DB: agr_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - agr_auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agr_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [agr-auth-data-net]


  # ============================================================
  # LÓGICA - AUTH SERVICE (responsable: Esteban)
  # ============================================================
  agr-auth-lo:
    build:
      context: ./agr-auth-lo
      dockerfile: Dockerfile
    container_name: agr-auth-lo
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://agr-auth-db:5432/agr_auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: super-secret-key-agora-proto-2-change-this-in-production-32bytes
    depends_on:
      agr-auth-db:
        condition: service_healthy
    restart: unless-stopped
    # Lab 5: el gateway espera a que auth esté sano (Spring Boot tarda en arrancar)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [agr-back-net, agr-auth-data-net]


  # ============================================================
  # ORQUESTACIÓN - API GATEWAY (responsable: David)
  # ============================================================
  # Único punto de entrada de la API. Está en agr-edge-net (lo alcanzan el web y la
  # CLI) y en agr-back-net (alcanza a los servicios); no ve las bases ni el broker.
  agr-gateway-or:
    container_name: agr-gateway-or
    build: ./agr-gateway-or
    environment:
      AUTH_SERVICE_URL: http://agr-auth-lo:8081
      VOTER_SERVICE_URL: http://agr-voter-lo:8001
      ELECTION_SERVICE_URL: http://agr-election-lo:8000
      VOTE_SERVICE_URL: http://agr-vote-lo:8002
      RESULTS_SERVICE_URL: http://agr-results-lo:8004
      AUDIT_SERVICE_URL: http://agr-audit-lo:8005
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      agr-election-lo:
        condition: service_healthy
      agr-auth-lo:
        condition: service_healthy
      agr-vote-lo:
        condition: service_healthy
      agr-voter-lo:
        condition: service_healthy
      agr-results-lo:
        condition: service_healthy
      agr-audit-lo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [agr-edge-net, agr-back-net]
    restart: unless-stopped


  # ============================================================
  # PRESENTACIÓN - WEB, Next.js con SSR (responsable: Cristian)
  # ============================================================
  # El servidor de Next.js llama al gateway por agr-edge-net; el navegador llama a
  # localhost:8080 solo para votar y para el SSE de resultados.
  agr-web-fr:
    container_name: agr-web-fr
    build: ./agr-web-fr
    environment:
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL:-http://agr-gateway-or:8080}
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      agr-gateway-or:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [agr-edge-net]
    restart: unless-stopped


  # ============================================================
  # PRESENTACIÓN - CLI DE ADMINISTRACIÓN (responsable: Maicol)
  # ============================================================
  # No corre con "up" (perfil tools). Uso:
  #   docker compose run --rm agr-admin-fr elections list
  agr-admin-fr:
    container_name: agr-admin-fr
    build: ./agr-admin-fr
    profiles: ["tools"]
    environment:
      AGORA_GATEWAY_URL: http://agr-gateway-or:8080
      AGORA_ADMIN_KEY: ${ADMIN_API_KEY:-dev-admin-key}
    networks: [agr-edge-net]


# ==============================================================
# REDES
# ==============================================================
# Lab 5 - Network Segmentation (diseño: lab5-security/design/flujos-permitidos.md)
#
# Regla: cada componente solo comparte red con lo que realmente necesita llamar.
#   internal: true  -> la red no tiene salida a internet ni se pueden publicar
#                      puertos desde ella; solo se hablan sus miembros.
#
# Reemplaza las redes del Prototipo 2 (agr-front, agr-back y agr-data, que era
# una red plana donde todos los servicios veían todas las bases).
networks:

  # --- Zona de borde: lo único alcanzable desde fuera de Docker ---------------
  # agr-web-fr (3000), agr-gateway-or (8080), agr-admin-fr (CLI)
  agr-edge-net:
    name: agr-edge-net

  # --- Zona de lógica: el gateway y los servicios -----------------------------
  # agr-gateway-or + agr-auth-lo, agr-voter-lo, agr-election-lo, agr-vote-lo,
  # agr-results-lo, agr-audit-lo. Los servicios no se llaman entre sí.
  agr-back-net:
    name: agr-back-net
    internal: true

  # --- Zona de datos: una red privada por servicio (servicio + su base) -------
  agr-auth-data-net:        # agr-auth-lo      + agr-auth-db       (Esteban)
    name: agr-auth-data-net
    internal: true
  agr-elections-data-net:   # agr-election-lo  + agr-elections-db  (David)
    name: agr-elections-data-net
    internal: true
  agr-voters-data-net:      # agr-voter-lo     + agr-voters-db     (Camilo)
    name: agr-voters-data-net
    internal: true
  agr-votes-data-net:       # agr-vote-lo      + agr-votes-db      (Sebastián)
    name: agr-votes-data-net
    internal: true
  agr-results-data-net:     # agr-results-lo   + agr-results-db    (Miguel)
    name: agr-results-data-net
    internal: true
  agr-audit-data-net:       # agr-audit-lo     + agr-audit-db      (Camilo)
    name: agr-audit-data-net
    internal: true

  # --- Zona de mensajería: el broker y solo sus clientes reales ---------------
  # agr-broker-as + agr-vote-lo (publica), agr-results-lo y agr-audit-lo (consumen)
  agr-bus-net:
    name: agr-bus-net
    internal: true

  # --- Zona de administración: consola de RabbitMQ ----------------------------
  # Solo agr-broker-as. No es internal porque publica 15672, pero en la Fase 2
  # se publica únicamente en 127.0.0.1 (no queda expuesta a la red local).
  agr-mgmt-net:
    name: agr-mgmt-net


# ==============================================================
# VOLÚMENES
# ==============================================================
volumes:
  elections-db-data:
  voters-db-data:
  votes-db-data:
  results-db-data:
  broker-data:
  audit-db-data:
  agr_auth_db_data:
