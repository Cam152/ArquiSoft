# R3 · Línea base: AGORA con la segmentación de S3 pero SIN el proxy (ni TLS ni
# límites de borde). Es como estaba p3 antes de S2: el gateway publica el 8080 y
# k6 le llega directo.
#
# Uso (desde la raíz del repo; ver p3/perf/README.md):
#   docker compose -f docker-compose.yml -f p3/perf/docker-compose.baseline.yml \
#     up -d --build --wait --scale agr-proxy-rp=0
#
# agr-edge-net es internal desde S2 y desde una red internal no se publican
# puertos, así que aquí el gateway se une también a agr-public-net. Solo para
# medir: nunca se usa así en el despliegue.

services:
  agr-gateway-or:
    ports:
      - "8080:8080"
    networks: [agr-public-net, agr-edge-net, agr-back-net]
