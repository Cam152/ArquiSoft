# Pruebas de punta a punta de agr-vote-lo. Se usa encima de docker-compose.yml:
#   ./agr-vote-lo/e2e/run.sh
# Solo arranca lo que el servicio necesita (agr-votes-db y agr-broker-as) más el
# contenedor que ejecuta las pruebas. Quita los nombres fijos de contenedor y los
# puertos publicados para no chocar con el sistema si ya está corriendo.
services:
  agr-votes-db:
    container_name: !reset null

  agr-broker-as:
    container_name: !reset null
    ports: !reset []

  agr-vote-lo:
    container_name: !reset null
    environment:
      # Revisión del outbox más frecuente para que las pruebas terminen rápido.
      OUTBOX_INTERVAL: 1s

  e2e:
    image: golang:1.23-alpine
    working_dir: /src
    volumes:
      - ./agr-vote-lo:/src:ro
    environment:
      VOTE_SERVICE_URL: http://agr-vote-lo:8002
      MONGO_URI: mongodb://${VOTES_DB_USER:-votes}:${VOTES_DB_PASSWORD:-votes}@agr-votes-db:27017/?authSource=admin
      MONGO_DB: ${VOTES_MONGO_DB:-votes}
      AMQP_URL: amqp://${BROKER_USER:-agora}:${BROKER_PASSWORD:-agora}@agr-broker-as:5672/
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key}
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: "0"
    command: ["go", "test", "-tags=e2e", "-count=1", "-v", "./e2e/"]
    depends_on:
      agr-vote-lo:
        condition: service_healthy
    # Con las redes del Prototipo 2 hay que unir el contenedor de pruebas a ellas:
    # sin esto queda en la red "default" y no alcanza a agr-vote-lo, la base ni el broker.
    networks: [agr-back, agr-data]
